<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptCrafter - صانع الـ Prompts الاحترافي</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --accent: #10b981;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .main-box {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .desc {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 20px;
        }
        .field {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover { background: var(--primary-hover); }
        .result-box {
            margin-top: 20px;
            background: var(--bg);
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
            color: var(--muted);
        }
        .copy-btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        #output {
            width: 100%;
            height: 80px;
            background: transparent;
            border: none;
            color: #38bdf8;
            font-size: 13px;
            direction: ltr;
            text-align: left;
            resize: none;
        }
        footer {
            width: 100%;
            max-width: 600px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
            padding: 10px;
        }
        footer a {
            color: #38bdf8;
            margin: 0 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="main-box">
        <h1>PromptCrafter ⚡</h1>
        <p class="desc">صانع وصف الصور بالذكاء الاصطناعي</p>

        <div class="field">
            <label>فكرة التصميم الرئيسية:</label>
            <input type="text" id="idea" placeholder="مثال: سيارة رياضية في الصحراء">
        </div>

        <div class="field">
            <label>الستايل الفني:</label>
            <select id="style">
                <option value="Photorealistic, ultra-detailed, 8k resolution">واقعي تصويري (Photorealistic 8K)</option>
                <option value="Anime style, Studio Ghibli, vibrant colors">أنمي ياباني (Anime)</option>
                <option value="Cyberpunk aesthetic, glowing neon lights">سايبربانك ونيون (Cyberpunk)</option>
                <option value="Cinematic movie scene, dramatic lighting">سينمائي (Cinematic)</option>
                <option value="3D render, Pixar style, soft lighting">رسم ثلاثي الأبعاد (3D Pixar)</option>
            </select>
        </div>

        <div class="field">
            <label>الإضاءة والأجواء:</label>
            <select id="lighting">
                <option value="Soft studio lighting">إضاءة استوديو ناعمة</option>
                <option value="Golden hour sunset glow">شروق/غروب الشمس (Golden Hour)</option>
                <option value="Dramatic neon backlight">إضاءة نيون قوية</option>
                <option value="Dark moody cinematic lighting">إضاءة درامية مظلمة</option>
            </select>
        </div>

        <div class="field">
            <label>أبعاد الصورة:</label>
            <select id="aspect">
                <option value="--ar 16:9">عريض يوتيوب (16:9)</option>
                <option value="--ar 1:1">مربع انستجرام (1:1)</option>
                <option value="--ar 9:16">طولي ستوري/تيك توك (9:16)</option>
            </select>
        </div>

        <button class="btn" onclick="generate()">توليد الـ Prompt الاحترافي 🚀</button>

        <div class="result-box">
            <div class="result-header">
                <span>النتيجة بالإنجليزية:</span>
                <button class="copy-btn" onclick="copyPrompt()">نسخ 📋</button>
            </div>
            <textarea id="output" readonly placeholder="سيظهر الـ Prompt هنا..."></textarea>
        </div>
    </div>

    <footer>
        <p>
            <a href="#" onclick="alert('PromptCrafter هي أداة لمساعدة المصممين في صياغة أوصاف صور الذكاء الاصطناعي.')">من نحن</a> | 
            <a href="#" onclick="alert('نحن نحترم خصوصية زوارنا ولا نجمع أي بيانات شخصية.')">سياسة الخصوصية</a> | 
            <a href="#" onclick="alert('للتواصل: support@promptcrafter.com')">اتصل بنا</a>
        </p>
        <p style="margin-top: 8px;">© 2026 PromptCrafter. جميع الحقوق محفوظة.</p>
    </footer>

    <script>
        function generate() {
            var idea = document.getElementById("idea").value.trim();
            var style = document.getElementById("style").value;
            var lighting = document.getElementById("lighting").value;
            var aspect = document.getElementById("aspect").value;

            if (!idea) {
                alert("اكتب فكرة التصميم الأول يا صاحبي!");
                return;
            }

            var prompt = idea + ", " + style + ", " + lighting + ", high quality, masterpiece " + aspect;
            document.getElementById("output").value = prompt;
        }

        function copyPrompt() {
            var txt = document.getElementById("output");
            if (!txt.value) {
                alert("ولد الـ Prompt الأول عشان تنسخه!");
                return;
            }
            txt.select();
            navigator.clipboard.writeText(txt.value);
            alert("تم النسخ بنجاح!");
        }
    </script>
</body>
</html>
