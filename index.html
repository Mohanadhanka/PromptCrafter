<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PromptCrafter - أداة صياغة الـ Prompts الاحترافية</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent: #10b981;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 6px;
            font-size: 26px;
            color: var(--text-main);
        }
        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 22px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: var(--primary-hover);
        }
        .clear-btn {
            background: #475569;
            flex: 0.3;
        }
        .clear-btn:hover {
            background: #64748b;
        }
        .output-section {
            margin-top: 25px;
            background: var(--bg-color);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .output-header span {
            font-size: 13px;
            color: var(--text-muted);
        }
        #resultText {
            width: 100%;
            background: transparent;
            border: none;
            color: #38bdf8;
            font-size: 14px;
            resize: none;
            height: 100px;
            outline: none;
            direction: ltr;
            text-align: left;
        }
        .copy-btn {
            background: var(--accent);
            font-size: 13px;
            padding: 6px 14px;
            width: auto;
            margin: 0;
            color: #0f172a;
        }
        .copy-btn:hover {
            background: #34d399;
        }
        
        /* تنسيق قسم الصفحات القانونية والتر تيل */
        footer {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
        }
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .footer-links a {
            color: #38bdf8;
            text-decoration: none;
            cursor: pointer;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }
